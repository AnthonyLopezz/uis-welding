<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="760" height="460" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Solución: filete intermitente escalonado"><title>Solución: filete intermitente escalonado</title><rect width="380" height="230" fill="#fff"/><g fill="none" stroke="#1f2937" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M110,100 L320,100"/><path d="M110,100 L55,165"/><path d="M55,165 L58.4,154.8 L64.5,159.9 Z" fill="#1f2937"/><path d="M159,100 L159,122 L181,100 "/><path d="M189,100 L189,78 L211,100 "/><text x="155" y="120" font-size="11" text-anchor="end" fill="#1f2937" stroke="none" font-weight="normal">1/4</text><text x="185" y="84" font-size="11" text-anchor="end" fill="#1f2937" stroke="none" font-weight="normal">1/4</text><text x="186" y="120" font-size="11" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">2-5</text><text x="216" y="84" font-size="11" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">2-5</text><text x="12" y="190" font-size="10" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">Filete a ambos lados con los triángulos DESPLAZADOS</text><text x="12" y="204" font-size="10" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">(uno no queda frente al otro) = intermitente ESCALONADO.</text><text x="12" y="218" font-size="10" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">Tamaño 1/4 a la izquierda; longitud-paso 2-5 a la derecha.</text></g></svg>