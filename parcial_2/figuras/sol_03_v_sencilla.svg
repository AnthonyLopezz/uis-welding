<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="760" height="460" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Solución: V sencilla con penetración completa"><title>Solución: V sencilla con penetración completa</title><rect width="380" height="230" fill="#fff"/><g fill="none" stroke="#1f2937" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M110,100 L320,100"/><path d="M110,100 L55,165"/><path d="M55,165 L58.4,154.8 L64.5,159.9 Z" fill="#1f2937"/><path d="M172,122 L185,100 L198,122"/><path d="M176,100 A9,9 0 0 1 194,100 Z" fill="#1f2937"/><text x="168" y="120" font-size="11" text-anchor="end" fill="#1f2937" stroke="none" font-weight="normal">3/8</text><text x="185" y="138" font-size="11" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="normal">60°</text><text x="185" y="114" font-size="9" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="normal">1/8</text><text x="12" y="190" font-size="10" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">V lado flecha: profundidad 3/8 a la izquierda, abertura de raíz 1/8</text><text x="12" y="204" font-size="10" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">DENTRO del símbolo y ángulo 60° debajo. Semicírculo relleno del otro</text><text x="12" y="218" font-size="10" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">lado = penetración completa (melt-through) visible en la raíz.</text></g></svg>