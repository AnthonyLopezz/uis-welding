<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="760" height="460" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Solución junta de esquina: J + filete"><title>Solución junta de esquina: J + filete</title><rect width="380" height="230" fill="#fff"/><g fill="none" stroke="#1f2937" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M110,100 L320,100"/><path d="M110,100 L80,130 L55,138 L55,165"/><path d="M55,165 L51.0,155.0 L59.0,155.0 Z" fill="#1f2937"/><path d="M177,100 L177,122"/><path d="M177,105 Q193,105 195,122"/><path d="M174,100 L174,78 L196,100 "/><text x="12" y="190" font-size="10" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">Lado flecha (exterior, abajo de la línea): ranura en J — el borde</text><text x="12" y="204" font-size="10" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">preparado es curvo. Otro lado (rincón interior): filete de refuerzo.</text><text x="12" y="218" font-size="10" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">Flecha QUEBRADA hacia la placa horizontal, que es la que se prepara.</text></g></svg>