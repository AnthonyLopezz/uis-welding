<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="760" height="460" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Solución ej. 1: filete todo alrededor"><title>Solución ej. 1: filete todo alrededor</title><rect width="380" height="230" fill="#fff"/><g fill="none" stroke="#1f2937" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M110,100 L320,100"/><path d="M110,100 L55,165"/><path d="M55,165 L58.4,154.8 L64.5,159.9 Z" fill="#1f2937"/><circle cx="110" cy="100" r="7"/><path d="M169,100 L169,122 L191,100 "/><text x="12" y="190" font-size="10" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">Filete del lado de la flecha (triángulo DEBAJO de la línea,</text><text x="12" y="204" font-size="10" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">cateto vertical a la izquierda) + círculo = soldadura todo alrededor.</text><text x="12" y="218" font-size="10" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">Sin cotas en el plano: no se indica tamaño ni longitud.</text></g></svg>