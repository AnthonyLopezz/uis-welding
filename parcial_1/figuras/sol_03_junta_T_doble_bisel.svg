<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="760" height="500" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Solución ej. 2: junta en T con doble bisel y filetes"><title>Solución ej. 2: junta en T con doble bisel y filetes</title><rect width="380" height="250" fill="#fff"/><g fill="none" stroke="#1f2937" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M110,100 L320,100"/><path d="M110,100 L80,130 L55,138 L55,165"/><path d="M55,165 L51.0,155.0 L59.0,155.0 Z" fill="#1f2937"/><path d="M162,122 L162,100 L182,122"/><path d="M201,100 L201,122 L223,100 "/><path d="M162,78 L162,100 L182,78"/><path d="M201,100 L201,78 L223,100 "/><text x="158" y="120" font-size="11" text-anchor="end" fill="#1f2937" stroke="none" font-weight="normal">S(E)</text><text x="198" y="120" font-size="11" text-anchor="end" fill="#1f2937" stroke="none" font-weight="normal">A</text><text x="158" y="84" font-size="11" text-anchor="end" fill="#1f2937" stroke="none" font-weight="normal">S(E)</text><text x="198" y="84" font-size="11" text-anchor="end" fill="#1f2937" stroke="none" font-weight="normal">B</text><text x="12" y="200" font-size="10" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">Doble bisel + filete de refuerzo a AMBOS lados (símbolos combinados).</text><text x="12" y="214" font-size="10" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">Flecha QUEBRADA hacia el miembro biselado (el alma de la T).</text><text x="12" y="228" font-size="10" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">S = profundidad del bisel, (E) = tamaño de la soldadura de ranura;</text><text x="12" y="242" font-size="10" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">A y B = tamaños de los filetes. Cotas siempre a la IZQUIERDA del símbolo.</text></g></svg>