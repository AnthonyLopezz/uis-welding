<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="760" height="460" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Solución ej. 4: ranura en U doble"><title>Solución ej. 4: ranura en U doble</title><rect width="380" height="230" fill="#fff"/><g fill="none" stroke="#1f2937" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M110,100 L320,100"/><path d="M110,100 L55,165"/><path d="M55,165 L58.4,154.8 L64.5,159.9 Z" fill="#1f2937"/><path d="M190,100 L190,109"/><path d="M179,124 L179,120 A11,11 0 0 1 201,120 L201,124"/><path d="M190,100 L190,91"/><path d="M179,76 L179,80 A11,11 0 0 0 201,80 L201,76"/><text x="172" y="120" font-size="11" text-anchor="end" fill="#1f2937" stroke="none" font-weight="normal">2(2 1/8)</text><text x="172" y="84" font-size="11" text-anchor="end" fill="#1f2937" stroke="none" font-weight="normal">2(2 1/8)</text><text x="190" y="146" font-size="11" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="normal">25°</text><text x="190" y="62" font-size="11" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="normal">25°</text><text x="12" y="190" font-size="10" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">Ranura en U a ambos lados (doble U). A la izquierda: profundidad de</text><text x="12" y="204" font-size="10" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">preparación S = 2 y, entre paréntesis, tamaño de soldadura (E) = 2 1/8.</text><text x="12" y="218" font-size="10" text-anchor="start" fill="#1f2937" stroke="none" font-weight="normal">El ángulo de ranura (25°) se escribe junto al símbolo de cada lado.</text></g></svg>